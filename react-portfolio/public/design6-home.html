<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Design 6 Home</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #000;
      font-family: Arial, sans-serif;
    }

    canvas {
      display: block;
    }

    .lil-gui.root {
      position: absolute;
      bottom: 20px;
      right: 20px;
      top: auto;
    }

    #fileInput {
      display: none;
    }

    .control-panel {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 20;
      width: min(320px, calc(100vw - 32px));
      padding: 16px;
      border-radius: 18px;
      background: rgba(12, 12, 12, 0.56);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(18px);
      color: #fff;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.28);
    }

    .control-panel h2 {
      margin: 0 0 12px;
      font-size: 1rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .control-grid {
      display: grid;
      gap: 10px;
    }

    .control-field {
      display: grid;
      gap: 6px;
    }

    .control-field label {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 0.82rem;
      color: rgba(255, 255, 255, 0.84);
    }

    .control-field input[type="range"] {
      width: 100%;
    }

    .upload-button {
      width: 100%;
      margin-top: 12px;
      padding: 12px 14px;
      border: 0;
      border-radius: 999px;
      background: #fff;
      color: #111;
      font-weight: 700;
      cursor: pointer;
    }

    .fallback-hero {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: end start;
      padding: clamp(24px, 4vw, 48px);
      background:
        linear-gradient(180deg, rgba(0, 0, 0, 0.18), rgba(0, 0, 0, 0.72)),
        url("https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=1964&auto=format&fit=crop")
          center / cover no-repeat;
      z-index: 0;
    }

    .fallback-hero__card {
      max-width: 620px;
      padding: 24px 28px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 24px;
      background: rgba(10, 10, 10, 0.32);
      backdrop-filter: blur(14px);
      color: #fff;
    }

    .fallback-hero__eyebrow {
      margin: 0 0 10px;
      font-size: 0.78rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.74);
    }

    .fallback-hero__title {
      margin: 0;
      font-size: clamp(2.4rem, 7vw, 5.8rem);
      line-height: 0.95;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .fallback-hero__text {
      margin: 14px 0 0;
      max-width: 46ch;
      line-height: 1.7;
      color: rgba(255, 255, 255, 0.82);
    }

    .webgl-ready .fallback-hero {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }
  </style>
</head>
<body>
  <section class="fallback-hero" aria-hidden="true">
    <div class="fallback-hero__card">
      <p class="fallback-hero__eyebrow">Portfolio Home</p>
      <h1 class="fallback-hero__title">Design 6</h1>
      <p class="fallback-hero__text">
        Interactive glass hero effect with image upload controls. If WebGL or external
        modules fail, this fallback hero stays visible instead of a black screen.
      </p>
    </div>
  </section>

  <input type="file" id="fileInput" accept="image/*" />
  <aside class="control-panel">
    <h2>Glass Controls</h2>
    <div class="control-grid">
      <div class="control-field">
        <label><span>Frequency</span><span id="frequencyValue">9.025</span></label>
        <input id="frequencyInput" type="range" min="1" max="50" step="0.001" value="9.025" />
      </div>
      <div class="control-field">
        <label><span>Angle</span><span id="rotationValue">136.08</span></label>
        <input id="rotationInput" type="range" min="-180" max="180" step="0.01" value="136.08" />
      </div>
      <div class="control-field">
        <label><span>Curvature</span><span id="curveValue">0.1</span></label>
        <input id="curveInput" type="range" min="0.01" max="3" step="0.01" value="0.1" />
      </div>
      <div class="control-field">
        <label><span>Distortion</span><span id="distortionValue">0.05</span></label>
        <input id="distortionInput" type="range" min="0" max="0.3" step="0.001" value="0.05" />
      </div>
      <div class="control-field">
        <label><span>Line Width</span><span id="lineWidthValue">0.015</span></label>
        <input id="lineWidthInput" type="range" min="0" max="0.1" step="0.001" value="0.015" />
      </div>
      <div class="control-field">
        <label><span>Brightness</span><span id="lineIntensityValue">0.06</span></label>
        <input id="lineIntensityInput" type="range" min="0" max="1" step="0.01" value="0.06" />
      </div>
      <div class="control-field">
        <label><span>Speed</span><span id="speedValue">0.184</span></label>
        <input id="speedInput" type="range" min="-1" max="1" step="0.001" value="0.184" />
      </div>
    </div>
    <button class="upload-button" id="uploadButton" type="button">Upload Image</button>
  </aside>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from "three";

    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x000000, 0);
    document.body.appendChild(renderer.domElement);

    const loader = new THREE.TextureLoader();
    loader.setCrossOrigin("anonymous");
    const defaultImgUrl =
      "https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=1964&auto=format&fit=crop";

    let glassMaterial;

    function createFallbackTexture() {
      const canvas = document.createElement("canvas");
      canvas.width = 1600;
      canvas.height = 1000;
      const ctx = canvas.getContext("2d");

      if (!ctx) {
        return new THREE.Texture();
      }

      const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
      gradient.addColorStop(0, "#1a1f36");
      gradient.addColorStop(0.5, "#3e5c76");
      gradient.addColorStop(1, "#f4a261");
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "rgba(255,255,255,0.12)";
      for (let i = 0; i < 18; i += 1) {
        ctx.beginPath();
        ctx.arc(
          Math.random() * canvas.width,
          Math.random() * canvas.height,
          40 + Math.random() * 140,
          0,
          Math.PI * 2,
        );
        ctx.fill();
      }

      ctx.fillStyle = "rgba(255,255,255,0.85)";
      ctx.font = "700 84px Arial";
      ctx.fillText("Portfolio Home", 120, 170);
      ctx.font = "32px Arial";
      ctx.fillText("Fallback texture loaded because the remote image was unavailable.", 120, 230);

      const texture = new THREE.CanvasTexture(canvas);
      texture.needsUpdate = true;
      return texture;
    }

    function bootScene(texture) {
      setupTexture(texture);
      createScene(texture);
    }

    loader.load(
      defaultImgUrl,
      (texture) => {
        bootScene(texture);
      },
      undefined,
      () => {
        bootScene(createFallbackTexture());
      }
    );

    function setupTexture(texture) {
      texture.wrapS = THREE.ClampToEdgeWrapping;
      texture.wrapT = THREE.ClampToEdgeWrapping;
      texture.minFilter = THREE.LinearFilter;
      texture.magFilter = THREE.LinearFilter;
    }

    function createScene(initialTexture) {
      document.documentElement.classList.add("webgl-ready");

      const vertexShader = `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = vec4(position, 1.0);
        }
      `;

      const fragmentShader = `
        uniform sampler2D tDiffuse;
        uniform vec2 uResolution;
        uniform vec2 uImageRes;
        uniform float uFrequency;
        uniform float uRotation;
        uniform float uDistortion;
        uniform float uCurvePow;
        uniform float uLineWidth;
        uniform float uLineIntensity;
        uniform float uTime;
        uniform float uSpeed;
        varying vec2 vUv;

        mat2 rotate2d(float angleValue) {
          return mat2(cos(angleValue), -sin(angleValue), sin(angleValue), cos(angleValue));
        }

        vec2 getCoverUv(vec2 uv, vec2 resolution, vec2 texResolution) {
          vec2 s = resolution;
          vec2 i = texResolution;
          float rs = s.x / s.y;
          float ri = i.x / i.y;
          vec2 scaled = rs < ri ? vec2(i.x * s.y / i.y, s.y) : vec2(s.x, i.y * s.x / i.x);
          vec2 offset =
            (rs < ri ? vec2((scaled.x - s.x) / 2.0, 0.0) : vec2(0.0, (scaled.y - s.y) / 2.0))
            / scaled;
          return uv * s / scaled + offset;
        }

        void main() {
          vec2 uv = getCoverUv(vUv, uResolution, uImageRes);
          vec2 centered = uv - 0.5;
          vec2 rotated = rotate2d(uRotation) * centered;
          float patternPhase = rotated.x * uFrequency + (uTime * uSpeed);
          float p = fract(patternPhase);
          float shapedP = pow(p, uCurvePow);
          float displacement = (shapedP - 0.5) * uDistortion;
          vec2 offsetVector = rotate2d(-uRotation) * vec2(displacement, 0.0);
          float r = texture2D(tDiffuse, uv + offsetVector).r;
          float g = texture2D(tDiffuse, uv + offsetVector * 1.01 + vec2(0.002, 0.0)).g;
          float b = texture2D(tDiffuse, uv + offsetVector * 1.02 + vec2(0.004, 0.0)).b;
          vec3 color = vec3(r, g, b);
          float line = smoothstep(1.0 - uLineWidth, 1.0, p);
          color += vec3(line * uLineIntensity);
          gl_FragColor = vec4(color, 1.0);
        }
      `;

      const initialParams = {
        frequency: 9.025,
        rotationDeg: 136.08,
        curvePow: 0.1,
        distortion: 0.05,
        lineWidth: 0.015,
        lineIntensity: 0.06,
        speed: 0.184
      };

      glassMaterial = new THREE.ShaderMaterial({
        uniforms: {
          tDiffuse: { value: initialTexture },
          uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
          uImageRes: { value: new THREE.Vector2(initialTexture.image.width, initialTexture.image.height) },
          uTime: { value: 0 },
          uFrequency: { value: initialParams.frequency },
          uRotation: { value: initialParams.rotationDeg * (Math.PI / 180) },
          uDistortion: { value: initialParams.distortion },
          uCurvePow: { value: initialParams.curvePow },
          uLineWidth: { value: initialParams.lineWidth },
          uLineIntensity: { value: initialParams.lineIntensity },
          uSpeed: { value: initialParams.speed }
        },
        vertexShader,
        fragmentShader
      });

      const geometry = new THREE.PlaneGeometry(2, 2);
      const mesh = new THREE.Mesh(geometry, glassMaterial);
      scene.add(mesh);

      const fileInput = document.getElementById("fileInput");
      const uploadButton = document.getElementById("uploadButton");

      const bindRange = (inputId, valueId, onChange) => {
        const input = document.getElementById(inputId);
        const value = document.getElementById(valueId);
        if (!input || !value) return;

        const sync = () => {
          value.textContent = input.value;
          onChange(Number(input.value));
        };

        input.addEventListener("input", sync);
        sync();
      };

      uploadButton?.addEventListener("click", () => {
        fileInput.click();
      });

      fileInput.addEventListener("change", (event) => {
        const file = event.target.files?.[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (readerEvent) => {
          const result = readerEvent.target?.result;
          if (typeof result !== "string") return;

          loader.load(result, (tex) => {
            setupTexture(tex);
            glassMaterial.uniforms.tDiffuse.value = tex;
            glassMaterial.uniforms.uImageRes.value.set(tex.image.width, tex.image.height);
          });
        };
        reader.readAsDataURL(file);
      });

      bindRange("frequencyInput", "frequencyValue", (value) => {
        glassMaterial.uniforms.uFrequency.value = value;
      });
      bindRange("rotationInput", "rotationValue", (value) => {
        glassMaterial.uniforms.uRotation.value = value * (Math.PI / 180);
      });
      bindRange("curveInput", "curveValue", (value) => {
        glassMaterial.uniforms.uCurvePow.value = value;
      });
      bindRange("distortionInput", "distortionValue", (value) => {
        glassMaterial.uniforms.uDistortion.value = value;
      });
      bindRange("lineWidthInput", "lineWidthValue", (value) => {
        glassMaterial.uniforms.uLineWidth.value = value;
      });
      bindRange("lineIntensityInput", "lineIntensityValue", (value) => {
        glassMaterial.uniforms.uLineIntensity.value = value;
      });
      bindRange("speedInput", "speedValue", (value) => {
        glassMaterial.uniforms.uSpeed.value = value;
      });

      window.addEventListener("resize", () => {
        renderer.setSize(window.innerWidth, window.innerHeight);
        glassMaterial.uniforms.uResolution.value.set(window.innerWidth, window.innerHeight);
      });

      const clock = new THREE.Clock();

      function animate() {
        requestAnimationFrame(animate);
        glassMaterial.uniforms.uTime.value = clock.getElapsedTime();
        renderer.render(scene, camera);
      }

      animate();
    }
  </script>
</body>
</html>
