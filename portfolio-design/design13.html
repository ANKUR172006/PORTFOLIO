<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .hero-section {
  width: 100%;
  height: 100vh;
  min-height: 100svh;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  z-index: 1;
}

.hero-container {
  width: 100%;
  height: 100vh;
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  clip-path: url(#clip-path1);
  background-color: var(--light);
  overflow: hidden;
}

.hero-bg-svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  display: block;
  opacity: 0;
}

.hero-content {
  position: relative;
  z-index: 1;
  color: #fff;
  text-align: center;
  font-family: system-ui, sans-serif;
  opacity: 0;
  max-width: 100vw;
  padding: 1rem;
}

.panel.text-dark * {
  color: var(--dark);
}

.column {
  flex-direction: column;
}

#clipContainer {
  position: absolute;
  top: 0;
  left: 0;
  opacity: 0;
  pointer-events: none;
  z-index: 0;
}

    </style>
</head>
<body>
    <section class="hero-section">
  <div class="hero-container">
    <svg class="hero-bg-svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="swirlGradient" cx="50%" cy="50%" r="80%">
          <stop offset="0%" stop-color="#0ae448" />
          <stop offset="60%" stop-color="#9d95ff" />
          <stop offset="100%" stop-color="#f100cb" />
        </radialGradient>
        <filter id="swirl" x="0" y="0">
          <feTurbulence type="turbulence" baseFrequency="0.012 0.018" numOctaves="2" seed="8" result="turb" />
          <feDisplacementMap in2="turb" in="SourceGraphic" scale="120" xChannelSelector="R" yChannelSelector="G" />
        </filter>
      </defs>
      <circle cx="600" cy="450" r="800" fill="url(#swirlGradient)" filter="url(#swirl)" />
    </svg>
    <div class="hero-content">
      <h1 class="text-dark">Hero Revealing Animation</h1>
      <p class="text-dark">Uses ScrollTrigger with pinning to reveal the hero section of a site and then keep scrolling.</p>
    </div>
  </div>
</section>

<section class="panel green center column text-dark">
  <h1>Some ScrollTrigger animations here</h1>
  <div class="box blue"></div>
  <div class="box"></div>
  <div class="box purple"></div>
</section>
<section class="panel red center text-dark">
  <h1>THE END!</h1>
</section>

<script>
    console.clear();

const container = document.querySelector(".hero-container");
let heightRatio = window.innerWidth / window.innerHeight;
const tl = gsap
  .timeline({
    scrollTrigger: {
      trigger: ".hero-section",
      start: "top top",
      end: "+=200%",
      pin: true,
      scrub: true,
      invalidateOnRefresh: true
    }
  })
  .fromTo(
    [".hero-bg-svg", ".hero-content"],
    {
      autoAlpha: 0
    },
    {
      autoAlpha: 1
    }
  )
  .fromTo(
    logoPath,
    {
      scaleX: 0.25,
      scaleY: () => 0.25 * heightRatio,
      x: 0,
      transformOrigin: "center center"
    },
    {
      scaleX: 21,
      scaleY: () => 21 * heightRatio,
      x: -1.45,
      transformOrigin: "center center",
      duration: 1,
      ease: "power2.in"
    }
  )
  .to({}, { duration: 0.25 });
const boxes = gsap.utils.toArray(".box");
gsap
  .timeline({
    scrollTrigger: {
      trigger: ".panel.green",
      start: "top 20%",
      end: "center 20%",
      scrub: true
    }
  })
  .to(boxes, {
    x: (i) => (i % 2 < 1 ? 100 : -100),
    rotation: (i) => (i % 2 < 1 ? 360 : -360),
    ease: "none"
  });

window.addEventListener("resize", () => {
  const { innerWidth, innerHeight } = window;
  heightRatio = innerWidth / innerHeight;
});

</script>
